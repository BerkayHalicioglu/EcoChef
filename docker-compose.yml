services:

  # ── MySQL ─────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ecochef_mysql
    ports:
      - "3306:3306"
    volumes:
      - ecochef_mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecochef_root}
      MYSQL_DATABASE: ${MYSQL_DB:-ecochef}
      MYSQL_USER: ${MYSQL_USER:-ecochef}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecochef_pass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-ecochef_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecochef_net

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecochef_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      YOLO_MODEL_PATH: /app/models/yolov8n.pt
      LLM_MODEL_PATH: /app/models/model.gguf
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecochef}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecochef_pass}
      MYSQL_DB: ${MYSQL_DB:-ecochef}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ecochef_net

  # ── Mobile (Expo Dev Server) ─────────────────────────────────────────────────
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: ecochef_mobile
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go
      - "19001:19001" # Expo Go (LAN)
      - "19002:19002" # Expo DevTools
    environment:
      EXPO_PUBLIC_BACKEND_URL: "http://${HOST_IP:-localhost}:8000"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${HOST_IP:-localhost}"
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecochef_net

volumes:
  ecochef_mysql:
    name: ecochef_database

networks:
  ecochef_net:
    driver: bridge
    name: ecochef_network
